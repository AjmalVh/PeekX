name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & System Info
        run: |
          xcodebuild -version
          sw_vers

      - name: Build PeekX (Debug)
        run: |
          xcodebuild clean build \
            -project PeekX.xcodeproj \
            -scheme PeekX \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""
