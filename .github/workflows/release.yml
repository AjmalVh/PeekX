name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Version name to release (e.g. v1.2, v1.2.1)'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version
          sw_vers
          uname -m

      - name: Determine Version and Tag
        id: versioning
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PROJ_VERSION=$(grep -m1 "MARKETING_VERSION" PeekX.xcodeproj/project.pbxproj | awk '{print $3}' | tr -d '";')
            TAG="v${PROJ_VERSION:-1.2}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building for Tag: $TAG (Version: $VERSION)"

      - name: Build PeekX (Universal Binary)
        run: |
          xcodebuild clean build \
            -project PeekX.xcodeproj \
            -scheme PeekX \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath ./build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Prepare Architecture Bundles (Universal, Apple Silicon, Intel)
        run: |
          ORIGINAL_APP="./build/Build/Products/Release/PeekX.app"
          rm -rf dist
          mkdir -p dist/universal dist/arm64 dist/x86_64

          # 1. Universal bundle
          cp -R "$ORIGINAL_APP" dist/universal/PeekX.app
          if [ -d "dist/universal/PeekX.app/Contents/PlugIns" ]; then
            find "dist/universal/PeekX.app/Contents/PlugIns" -name "*.appex" -type d -exec codesign --force --deep --sign - {} +
          fi
          codesign --force --deep --sign - "dist/universal/PeekX.app"
          codesign --verify --deep --strict --verbose=2 "dist/universal/PeekX.app"

          # 2. Apple Silicon (arm64) bundle
          cp -R "$ORIGINAL_APP" dist/arm64/PeekX.app
          lipo -thin arm64 "dist/arm64/PeekX.app/Contents/MacOS/PeekX" -output "dist/arm64/PeekX.app/Contents/MacOS/PeekX.thin"
          mv "dist/arm64/PeekX.app/Contents/MacOS/PeekX.thin" "dist/arm64/PeekX.app/Contents/MacOS/PeekX"

          if [ -d "dist/arm64/PeekX.app/Contents/PlugIns" ]; then
            for appex in dist/arm64/PeekX.app/Contents/PlugIns/*.appex; do
              if [ -d "$appex" ]; then
                name=$(basename "$appex" .appex)
                lipo -thin arm64 "$appex/Contents/MacOS/$name" -output "$appex/Contents/MacOS/$name.thin"
                mv "$appex/Contents/MacOS/$name.thin" "$appex/Contents/MacOS/$name"
                codesign --force --deep --sign - "$appex"
              fi
            done
          fi
          codesign --force --deep --sign - "dist/arm64/PeekX.app"
          codesign --verify --deep --strict --verbose=2 "dist/arm64/PeekX.app"

          # 3. Intel (x86_64) bundle
          cp -R "$ORIGINAL_APP" dist/x86_64/PeekX.app
          lipo -thin x86_64 "dist/x86_64/PeekX.app/Contents/MacOS/PeekX" -output "dist/x86_64/PeekX.app/Contents/MacOS/PeekX.thin"
          mv "dist/x86_64/PeekX.app/Contents/MacOS/PeekX.thin" "dist/x86_64/PeekX.app/Contents/MacOS/PeekX"

          if [ -d "dist/x86_64/PeekX.app/Contents/PlugIns" ]; then
            for appex in dist/x86_64/PeekX.app/Contents/PlugIns/*.appex; do
              if [ -d "$appex" ]; then
                name=$(basename "$appex" .appex)
                lipo -thin x86_64 "$appex/Contents/MacOS/$name" -output "$appex/Contents/MacOS/$name.thin"
                mv "$appex/Contents/MacOS/$name.thin" "$appex/Contents/MacOS/$name"
                codesign --force --deep --sign - "$appex"
              fi
            done
          fi
          codesign --force --deep --sign - "dist/x86_64/PeekX.app"
          codesign --verify --deep --strict --verbose=2 "dist/x86_64/PeekX.app"

          echo "--- Architecture Verification ---"
          echo "Universal binary:"
          lipo -info "dist/universal/PeekX.app/Contents/MacOS/PeekX"
          echo "Apple Silicon (arm64) binary:"
          lipo -info "dist/arm64/PeekX.app/Contents/MacOS/PeekX"
          echo "Intel (x86_64) binary:"
          lipo -info "dist/x86_64/PeekX.app/Contents/MacOS/PeekX"

      - name: Package DMGs and ZIPs
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          package_flavor() {
            local flavor="$1"
            local suffix="$2"
            local app_path="dist/${flavor}/PeekX.app"
            local staging="staging_${flavor}"

            local dmg_name="PeekX-${VERSION}${suffix}.dmg"
            local zip_name="PeekX-${VERSION}${suffix}.zip"

            rm -rf "$staging"
            mkdir -p "$staging"
            cp -R "$app_path" "$staging/"
            ln -s /Applications "$staging/Applications"

            echo "Packaging $dmg_name..."
            hdiutil create \
              -volname "PeekX" \
              -srcfolder "$staging" \
              -ov \
              -format UDZO \
              "artifacts/$dmg_name"

            echo "Packaging $zip_name..."
            ditto -c -k --sequesterRsrc --keepParent "$app_path" "artifacts/$zip_name"

            (cd artifacts && shasum -a 256 "$dmg_name" > "${dmg_name}.sha256")
            (cd artifacts && shasum -a 256 "$zip_name" > "${zip_name}.sha256")
          }

          # Apple Silicon (arm64)
          package_flavor "arm64" "-arm64"

          # Intel (x86_64)
          package_flavor "x86_64" "-x86_64"

          # Universal (default)
          package_flavor "universal" ""

          # Universal (explicit suffix)
          cp "artifacts/PeekX-${VERSION}.dmg" "artifacts/PeekX-${VERSION}-universal.dmg"
          cp "artifacts/PeekX-${VERSION}.zip" "artifacts/PeekX-${VERSION}-universal.zip"
          (cd artifacts && shasum -a 256 "PeekX-${VERSION}-universal.dmg" > "PeekX-${VERSION}-universal.dmg.sha256")
          (cd artifacts && shasum -a 256 "PeekX-${VERSION}-universal.zip" > "PeekX-${VERSION}-universal.zip.sha256")

          echo "Generated release artifacts:"
          ls -lh artifacts/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PeekX-${{ env.VERSION }}-all-architectures
          path: artifacts/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_FLAGS=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            EXTRA_FLAGS+=(--draft)
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            EXTRA_FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading/updating all architecture assets..."
            gh release upload "$TAG" artifacts/* --clobber
          else
            echo "Creating release $TAG with all architecture assets..."
            gh release create "$TAG" \
              artifacts/* \
              --title "PeekX ${TAG}" \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi
